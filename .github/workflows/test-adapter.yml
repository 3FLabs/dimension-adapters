name: test-adapter

# Read-only workflow: the job only checks out the repo and runs the adapter test
# harness, so the default write-capable token is stripped.
permissions:
  contents: read

on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: file_changes
        # Pinned to an immutable commit SHA (v1); a retagged release cannot
        # silently change what runs here.
        uses: trilom/file-changes-action@ce38c8ce2459ca3c303415eec8cb0409857b4272 # v1
        with:
          output: 'json'
          fileOutput: 'json'

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Record PR number
        run: |
          mkdir -p pr-comments
          echo "${{ github.event.number }}" > pr-comments/pr-number.txt

      - name: Run changes files through test script
        env:
          # File lists are routed through the environment instead of being
          # interpolated into the shell script: PR file names are
          # attacker-controlled, and `${{ }}` interpolation would let a crafted
          # name inject shell commands (CWE-78).
          FILES_MODIFIED: ${{ steps.file_changes.outputs.files_modified }}
          FILES_ADDED: ${{ steps.file_changes.outputs.files_added }}
        run: |
          # Store the current commit hash in a variable
          current_commit=$(git rev-parse HEAD)

          # Checkout to master to check if new adapters files are of v2
          git fetch origin master:master

          # Checkout back to the original commit
          git checkout $current_commit

          RUN_FILES=$(
            MODIFIED="$FILES_MODIFIED" \
            ADDED="$FILES_ADDED" \
            node ${{ github.workspace }}/.github/workflows/getFileList.js
          )

          if [ "$RUN_FILES" = "[]" ]; then
            echo "No adapter files were modified"
            exit 0
          fi

          # Turn the JSON array into newline-separated entries with Node so the
          # loop never word-splits or glob-expands untrusted content.
          list=$(node -e 'const fs = require("fs"); const items = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(items.join("\n"));' <<< "$RUN_FILES")

          while IFS= read -r i; do
            [ -z "$i" ] && continue
            {
              IFS='@' read -r -a array <<< "$i"
              npm run test "${array[0]}" "${array[1]}" 2>&1 | tee output.txt
              node ${{ github.workspace }}/.github/workflows/commentResult.js ${{ github.workspace }}/output.txt ${{ github.workspace }}/pr-comments "$i"
              if grep -q "\-\-\-\- ERROR \-\-\-\-" output.txt; then
                exit 1;
              fi
            } || {
              echo -n "$i"
              echo ' doesnt run'
            }
          done <<< "$list"

      - name: Upload PR comments artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-comments
          path: pr-comments/
          if-no-files-found: ignore
          retention-days: 1
